<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet For You 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    /* Soft, light, warm background for the sunflowers */
    background: radial-gradient(circle at center, #fffef0 0%, #fff6d9 60%, #ffedb3 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #msg {
    position: absolute;
    top: 8%;
    left: 50%;
    width: min(92vw, 680px);
    transform: translate(-50%, 24px) scale(0.98);
    text-align: center;
    color: #4a3b2c;
    opacity: 0;
    z-index: 5;
    pointer-events: none;
    padding: 20px 24px;
    border-radius: 28px;
    /* Light translucent card for readability on light background */
    background: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.45));
    border: 1px solid rgba(255, 230, 180, 0.6);
    box-shadow: 0 18px 40px rgba(150, 100, 30, 0.15), inset 0 0 22px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    animation: messageAppear 3s cubic-bezier(.2,.85,.18,1) forwards 6.7s;
  }
  #msg span {
    display: block;
    text-shadow: 0 0 15px rgba(255,255,255,0.8);
  }
  #msg .small {
    font-size: clamp(17px, 3.8vw, 24px);
    letter-spacing: 0.5px;
    color: #63503d;
    margin-bottom: 8px;
  }
  #msg .main {
    font-size: clamp(20px, 5.2vw, 34px);
    line-height: 1.35;
    font-weight: 700;
    color: #3b2a1a;
  }
  #msg .soft {
    margin-top: 12px;
    font-size: clamp(15px, 3.2vw, 21px);
    line-height: 1.5;
    color: #725b44;
    font-style: italic;
  }
  @keyframes messageAppear {
    0%   { opacity: 0; transform: translate(-50%, 24px) scale(0.98); filter: blur(7px); }
    55%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
  }
  /* Mobile-first adjustments */
  @media (max-width: 600px) {
    #msg {
      top: 6%;
      padding: 18px 16px;
      border-radius: 22px;
      width: 95vw;
    }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="msg">
  <span class="small">Don't think much dear,</span>
  <span class="main">you are strong and you'll handle everything gracefully.</span>
  <span class="soft">For surviving a heavy day, you deserve something beautiful today 🌻</span>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, CX, BASE, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W   = window.innerWidth;
  H   = window.innerHeight;

  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX   = W / 2;
  BASE = H * 0.88;
}
resize();
window.addEventListener('resize', resize);

/* ── helpers ─────────────────────────────── */
const clamp   = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = x => x * x * (3 - 2 * x);
const easeDeep = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const seg      = (p,s,e) => easeDeep(clamp((p-s)/(e-s), 0, 1));

/* ── ambient motes (dust/pollen) ─────────── */
const STARS = Array.from({length: 150}, () => ({
  x:     Math.random(),
  y:     Math.random() * 0.90,
  r:     Math.random() * 1.8 + 0.3,
  phase: Math.random() * Math.PI * 2,
  speed: 0.015 + Math.random() * 0.03,
  gold:  Math.random() < 0.7
}));

function drawBg() {
  // Light gradient drawing
  const bg = ctx.createRadialGradient(CX, H*0.4, 10, CX, H*0.6, H);
  bg.addColorStop(0,    '#fffcf2');
  bg.addColorStop(0.4,  '#fff6dd');
  bg.addColorStop(0.8,  '#ffedb8');
  bg.addColorStop(1,    '#ffe499');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Soft shadow/ground base
  const pool = ctx.createRadialGradient(CX, BASE+10, 5, CX, BASE-20, 220);
  pool.addColorStop(0, 'rgba(180, 130, 40, 0.15)');
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  for (const s of STARS) {
    s.phase += s.speed;
    const a = 0.1 + 0.5 * Math.abs(Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    // Golden and soft yellow motes for daylight theme
    ctx.fillStyle = s.gold ? `rgba(255, 180, 50, ${a})` : `rgba(255, 230, 120, ${a})`;
    ctx.fill();
  }
}

/* ── sparkles ────────────────────────────── */
const SPARKS = Array.from({length: 60}, () => { const s={}; resetSp(s); s.life=Math.random()*s.max; return s; });
function resetSp(s) {
  s.x    = CX + (Math.random()-0.5)*350;
  s.y    = BASE - 50 - Math.random()*350;
  s.vy   = -0.15 - Math.random()*0.5;
  s.life = 0;
  s.max  = 0.8 + Math.random()*0.8;
  s.sz   = 1.0 + Math.random()*2.5;
  // Golden / sunny hues
  s.hue  = 35 + Math.random()*30;
}
function drawSparkles(show) {
  if (!show) return;
  for (const s of SPARKS) {
    s.life += 0.0065;
    if (s.life > s.max) resetSp(s);
    const a = Math.sin((s.life/s.max)*Math.PI) * show * 0.8;
    ctx.beginPath();
    ctx.arc(s.x + Math.sin(s.life*3)*4, s.y + s.vy*s.life*50, s.sz, 0, Math.PI*2);
    ctx.fillStyle   = `hsla(${s.hue},100%,60%,${a})`;
    ctx.shadowColor = `hsla(${s.hue},100%,70%,${a})`;
    ctx.shadowBlur  = 10;
    ctx.fill();
    ctx.shadowBlur  = 0;
  }
}

/* ── floating sunflowers drifting ────────── */
const FLOATERS = Array.from({length: 35}, () => ({
  x: Math.random() * W + Math.random() * W,
  y: H * 0.03 + Math.random() * H * 0.9,
  size: 4 + Math.random() * 10,
  speed: 0.1 + Math.random() * 0.5,
  drift: Math.random() * Math.PI * 2,
  wobble: 0.3 + Math.random() * 1.0,
  rot: Math.random() * Math.PI * 2,
  spin: (Math.random() - 0.5) * 0.015,
  alpha: 0.3 + Math.random() * 0.5,
  layer: Math.random()
}));

function drawFloatingFlowers(t) {
  for (const f of FLOATERS) {
    const depth = 0.5 + f.layer * 1.2;
    f.x -= f.speed * depth;
    f.y += Math.sin(t * 0.0004 * f.wobble + f.drift) * 0.15;
    f.rot += f.spin;

    if (f.x < -40) {
      f.x = W + 20 + Math.random() * 150;
      f.y = H * 0.03 + Math.random() * H * 0.9;
      f.size = 4 + Math.random() * 10;
      f.speed = 0.1 + Math.random() * 0.5;
    }

    const s = f.size * depth;
    const pulse = 0.8 + Math.sin(t * 0.001 + f.drift) * 0.2;

    ctx.save();
    ctx.globalAlpha = f.alpha * pulse;
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    
    // Draw Mini Sunflower
    ctx.shadowColor = 'rgba(255, 180, 50, 0.3)';
    ctx.shadowBlur = 6 * depth;

    // Petals
    const petals = 8;
    for (let i = 0; i < petals; i++) {
      ctx.save();
      ctx.rotate((Math.PI * 2 / petals) * i);
      const g = ctx.createLinearGradient(0, 0, 0, -s);
      g.addColorStop(0, '#ffa000');
      g.addColorStop(1, '#ffecb3');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, -s * 0.6, s * 0.28, s * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Center disc
    ctx.shadowBlur = 2 * depth;
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = '#5d4037';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = '#3e2723';
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}

/* ── bezier helpers ──────────────────────── */
function bezPt(x0,y0, cx1,cy1, cx2,cy2, x1,y1, t) {
  const m = 1-t;
  return [
    m*m*m*x0 + 3*m*m*t*cx1 + 3*m*t*t*cx2 + t*t*t*x1,
    m*m*m*y0 + 3*m*m*t*cy1 + 3*m*t*t*cy2 + t*t*t*y1
  ];
}
function bezAngle(x0,y0, cx1,cy1, cx2,cy2, x1,y1, t) {
  const m = 1-t;
  const dx = 3*m*m*(cx1-x0) + 6*m*t*(cx2-cx1) + 3*t*t*(x1-cx2);
  const dy = 3*m*m*(cy1-y0) + 6*m*t*(cy2-cy1) + 3*t*t*(y1-cy2);
  return Math.atan2(dy, dx);
}
function drawStem(x0,y0, cx1,cy1, cx2,cy2, x1,y1, prog, thick, col) {
  if (prog <= 0) return;
  ctx.beginPath();
  const steps = 48;
  for (let i = 0; i <= steps*prog; i++) {
    const [px,py] = bezPt(x0,y0,cx1,cy1,cx2,cy2,x1,y1, i/steps);
    i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.strokeStyle = col;
  ctx.lineWidth   = thick;
  ctx.lineCap     = 'round';
  ctx.stroke();
}

/* ── leaves ──────────────────────────────── */
function drawLeaf(x, y, rot, size, prog, colA, colB, colC) {
  if (prog <= 0) return;
  const s = size * prog;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(s * 0.3, s * 0.25, s * 0.8, s * 0.1, s, 0);
  ctx.bezierCurveTo(s * 0.8, -s * 0.15, s * 0.3, -s * 0.25, 0, 0);
  const lg = ctx.createLinearGradient(0, 0, s, 0);
  lg.addColorStop(0, colA);
  lg.addColorStop(0.5, colB);
  lg.addColorStop(1, colC);
  ctx.fillStyle = lg;
  ctx.fill();
  
  // Leaf vein
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(s * 0.5, 0, s * 0.9, 0);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = s * 0.03;
  ctx.stroke();
  ctx.restore();
}

/* ════════════════════════════════════════════
   FLOWER RENDERERS
   ════════════════════════════════════════════ */

/* ---- SUNFLOWER ---- (The main feature) */
function drawSunflower(x, y, size, prog, t, wob, stemAngle) {
  if (prog <= 0) return;
  const s   = size * prog * 1.4;
  const rot = Math.sin(t*0.0008 + wob) * 0.04;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.shadowColor = 'rgba(255, 180, 20, 0.4)';
  ctx.shadowBlur  = 12 * prog;

  const petalCount = 18;
  for (let i = 0; i < petalCount; i++) {
    const ang = (i / petalCount) * Math.PI * 2;
    ctx.save();
    ctx.rotate(ang);
    const grad = ctx.createLinearGradient(0, 0, 0, -s*0.9);
    grad.addColorStop(0, '#f9a825'); // Deep orange/gold
    grad.addColorStop(0.5, '#ffca28');
    grad.addColorStop(1, '#fff59d'); // Light tip
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-s*0.09, 0);
    ctx.quadraticCurveTo(-s*0.16, -s*0.6, 0, -s*0.9);
    ctx.quadraticCurveTo(s*0.16, -s*0.6, s*0.09, 0);
    ctx.fill();
    ctx.restore();
  }

  // Seed disc
  ctx.shadowBlur = 5;
  ctx.shadowColor = 'rgba(50, 20, 0, 0.3)';
  const disc = ctx.createRadialGradient(0,0,2, 0,0, s*0.42);
  disc.addColorStop(0, '#5d4037');
  disc.addColorStop(0.6, '#3e2723');
  disc.addColorStop(1, '#1b1009');
  ctx.fillStyle = disc;
  ctx.beginPath();
  ctx.arc(0, 0, s*0.4, 0, Math.PI*2);
  ctx.fill();

  // Seed texture
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255, 200, 100, 0.18)';
  for (let i = 0; i < 45; i++) {
    const rr = ((i * 19) % 43) / 43 * s * 0.36;
    const aa = i * 2.399963;
    ctx.beginPath();
    ctx.arc(Math.cos(aa)*rr, Math.sin(aa)*rr, s*0.015, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* ---- WHITE LILY ---- (To add contrast) */
function drawLily(x, y, size, prog, t, wob, stemAngle) {
  if (prog <= 0) return;
  const s   = size * prog * 1.3;
  const rot = (stemAngle + Math.PI/2) * 0.15 + Math.sin(t*0.001 + wob) * 0.03;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
  ctx.shadowBlur  = 15 * prog;

  const petals = 6;
  for (let i = 0; i < petals; i++) {
    const ang = (i / petals) * Math.PI * 2;
    ctx.save();
    ctx.rotate(ang);
    const grad = ctx.createLinearGradient(0, 0, 0, -s);
    grad.addColorStop(0, '#fff9c4'); // Yellowish center to match theme
    grad.addColorStop(0.4, '#ffffff');
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-s*0.25, -s*0.4, -s*0.18, -s*0.9, 0, -s);
    ctx.bezierCurveTo(s*0.18, -s*0.9, s*0.25, -s*0.4, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  // Stamens
  ctx.shadowBlur = 0;
  for (let i = 0; i < 6; i++) {
    const ang = (i / 6) * Math.PI * 2 + 0.3;
    const tx = Math.cos(ang) * s * 0.25;
    const ty = -Math.sin(ang) * s * 0.25 - s*0.1;
    ctx.beginPath();
    ctx.moveTo(0, -s*0.05);
    ctx.lineTo(tx, ty);
    ctx.strokeStyle = '#cddc39';
    ctx.lineWidth = s*0.012;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(tx, ty, s*0.025, 0, Math.PI*2);
    ctx.fillStyle = '#6d4c41';
    ctx.fill();
  }
  ctx.restore();
}

const RENDERERS = {
  sunflower: drawSunflower,
  lily:      drawLily
};

/* ════════════════════════════════════════════
   BOUQUET LAYOUT (Mostly Sunflowers)
   ════════════════════════════════════════════ */
const START    = performance.now();
const DURATION = 9500;
let   progress = 0;

function buildStems(sc) {
  const leafSun = ['#558b2f','#7cb342','#33691e'];
  const leafLily = ['#689f38','#8bc34a','#33691e'];

  // Array of 13 stems, mostly sunflowers for a bright, rich arrangement
  return [
    { bxo: -180*sc, byo:0, cp1x:-185*sc, cp1y:-70*sc,  cp2x:-200*sc, cp2y:-165*sc, tx:-210*sc, ty:-240*sc, fs:30*sc, ps:[0.10,0.55], wob:2.2, type:'sunflower', leaf:leafSun },
    { bxo: -155*sc, byo:0, cp1x:-160*sc, cp1y:-90*sc,  cp2x:-175*sc, cp2y:-215*sc, tx:-185*sc, ty:-310*sc, fs:34*sc, ps:[0.04,0.48], wob:1.6, type:'lily',      leaf:leafLily },
    { bxo: -120*sc, byo:0, cp1x:-130*sc, cp1y:-105*sc, cp2x:-140*sc, cp2y:-245*sc, tx:-150*sc, ty:-360*sc, fs:38*sc, ps:[0.07,0.51], wob:1.3, type:'sunflower', leaf:leafSun },
    { bxo: -85*sc,  byo:0, cp1x:-95*sc,  cp1y:-118*sc, cp2x:-105*sc, cp2y:-248*sc, tx:-115*sc, ty:-410*sc, fs:40*sc, ps:[0.03,0.47], wob:1.0, type:'sunflower', leaf:leafSun },
    { bxo: -50*sc,  byo:0, cp1x:-55*sc,  cp1y:-118*sc, cp2x:-60*sc,  cp2y:-250*sc, tx:-70*sc,  ty:-320*sc, fs:35*sc, ps:[0.08,0.52], wob:0.7, type:'lily',      leaf:leafLily },
    { bxo: -25*sc,  byo:0, cp1x:-30*sc,  cp1y:-90*sc,  cp2x:-35*sc,  cp2y:-195*sc, tx:-40*sc,  ty:-280*sc, fs:32*sc, ps:[0.05,0.44], wob:0.4, type:'sunflower', leaf:leafSun },
    { bxo:   0,     byo:0, cp1x:  0,     cp1y:-155*sc, cp2x:  0,     cp2y:-320*sc, tx:  0,     ty:-460*sc, fs:52*sc, ps:[0.00,0.42], wob:0.0, type:'sunflower', leaf:leafSun },
    { bxo:  25*sc,  byo:0, cp1x: 30*sc,  cp1y:-90*sc,  cp2x: 35*sc,  cp2y:-195*sc, tx: 40*sc,  ty:-290*sc, fs:36*sc, ps:[0.06,0.45], wob:-0.4,type:'sunflower', leaf:leafSun },
    { bxo:  50*sc,  byo:0, cp1x: 55*sc,  cp1y:-118*sc, cp2x: 60*sc,  cp2y:-250*sc, tx: 70*sc,  ty:-335*sc, fs:33*sc, ps:[0.09,0.53], wob:-0.7,type:'lily',      leaf:leafLily },
    { bxo:  85*sc,  byo:0, cp1x: 95*sc,  cp1y:-118*sc, cp2x: 105*sc, cp2y:-248*sc, tx: 115*sc, ty:-400*sc, fs:42*sc, ps:[0.04,0.49], wob:-1.0,type:'sunflower', leaf:leafSun },
    { bxo: 120*sc,  byo:0, cp1x: 130*sc, cp1y:-105*sc, cp2x: 140*sc, cp2y:-245*sc, tx: 150*sc, ty:-350*sc, fs:38*sc, ps:[0.08,0.52], wob:-1.3,type:'sunflower', leaf:leafSun },
    { bxo: 155*sc,  byo:0, cp1x: 160*sc, cp1y:-90*sc,  cp2x: 175*sc, cp2y:-215*sc, tx: 185*sc, ty:-315*sc, fs:34*sc, ps:[0.05,0.50], wob:-1.6,type:'lily',      leaf:leafLily },
    { bxo: 180*sc,  byo:0, cp1x: 185*sc, cp1y:-70*sc,  cp2x: 200*sc, cp2y:-165*sc, tx: 210*sc, ty:-250*sc, fs:30*sc, ps:[0.11,0.56], wob:-2.2,type:'sunflower', leaf:leafSun },
  ];
}

/* ── ribbon around the stems ─────────────── */
function drawRibbon(prog) {
  if (prog <= 0) return;
  ctx.save();
  ctx.translate(CX, BASE + 10);
  const w = 140, h = 26;
  const grad = ctx.createLinearGradient(-w,0,w,0);
  grad.addColorStop(0, '#e6c27a');
  grad.addColorStop(0.5, '#fff9e6');
  grad.addColorStop(1, '#e6c27a');
  ctx.fillStyle = grad;
  ctx.shadowColor = 'rgba(0,0,0,0.1)';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(0, 0, w*prog, h, 0, 0, Math.PI*2);
  ctx.fill();

  // bow
  ctx.shadowBlur = 4;
  ctx.fillStyle = '#fbc02d';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-25*prog,-20*prog,-45*prog,-2*prog,-5*prog,2*prog);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(25*prog,-20*prog,45*prog,-2*prog,5*prog,2*prog);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0,0,7*prog,0,Math.PI*2);
  ctx.fillStyle = '#f57f17';
  ctx.fill();
  ctx.restore();
}

function draw() {
  const elapsed = performance.now() - START;
  progress = Math.min(elapsed / DURATION, 1);
  const p  = progress;
  const t  = elapsed;

  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawStars();
  drawFloatingFlowers(t);

  let sc = Math.min(W,H) / 750;
  if (W < 600) sc = W / 400; // Mobile scale adjustment

  const bx = CX, by = BASE;
  // Lighter stem greens for the bright aesthetic
  const SD = '#4a7c36', SL = '#7cb342'; 
  const stems = buildStems(sc);

  stems.forEach((st) => {
    const sx0  = bx + st.bxo,  sy0  = by;
    const sx1  = bx + st.tx,   sy1  = by + st.ty;
    const cp1x = bx + st.cp1x, cp1y = by + st.cp1y;
    const cp2x = bx + st.cp2x, cp2y = by + st.cp2y;
    const sp   = seg(p, st.ps[0], st.ps[1]);

    drawStem(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, sp, 4.2*sc, SD);
    drawStem(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, sp, 2.2*sc, SL);

    const leafData = [ { t: 0.25, dir: -1 }, { t: 0.45, dir: 1 }, { t: 0.65, dir: -1 } ];
    leafData.forEach((leaf) => {
      if (sp > leaf.t) {
        const [lx, ly] = bezPt(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, leaf.t);
        const lAngle   = bezAngle(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, leaf.t);
        const leafRot  = lAngle + (Math.PI / 6.5) * leaf.dir;
        const lProg    = clamp((sp - leaf.t) * 4, 0, 1);
        drawLeaf(lx, ly, leafRot, st.fs * 2.0, lProg, st.leaf[0], st.leaf[1], st.leaf[2]);
      }
    });

    const curT     = Math.min(sp, 1);
    const [fx, fy] = bezPt(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, curT);
    const angle    = bezAngle(sx0,sy0, cp1x,cp1y, cp2x,cp2y, sx1,sy1, curT);
    const fp       = seg(p, st.ps[1]-0.05, st.ps[1]+0.22);

    RENDERERS[st.type](fx, fy, st.fs, fp, t, st.wob, angle);
  });

  drawRibbon(seg(p, 0.58, 0.80));
  drawSparkles(seg(p, 0.30, 0.66));

  requestAnimationFrame(draw);
}

draw();
</script>
